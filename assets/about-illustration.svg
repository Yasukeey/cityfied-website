<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="Illustration of a small business owner serving a customer outside a Cityfied-branded shop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0faff"/>
      <stop offset="1" stop-color="#e2f3fc"/>
    </linearGradient>
    <clipPath id="awningClip">
      <polygon points="165,222 515,222 535,282 145,282"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="640" fill="url(#bg)"/>
  <circle cx="450" cy="330" r="255" fill="#e7f5fd"/>
  <circle cx="715" cy="118" r="62" fill="#fdeaca"/>
  <circle cx="105" cy="540" r="80" fill="#d2ebfa"/>
  <circle cx="818" cy="470" r="40" fill="#d2ebfa"/>

  <!-- sparkle accents -->
  <g stroke="#0e9de8" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M795 200 v16 M787 208 h16"/>
    <path d="M96 240 v16 M88 248 h16"/>
    <path d="M760 560 v16 M752 568 h16"/>
  </g>

  <!-- ground -->
  <ellipse cx="450" cy="524" rx="395" ry="24" fill="#cfe9f8"/>
  <ellipse cx="340" cy="520" rx="205" ry="13" fill="#b9dff3"/>
  <ellipse cx="655" cy="522" rx="70" ry="10" fill="#b9dff3"/>

  <!-- growth bars + arrow -->
  <g>
    <rect x="95" y="232" width="22" height="52" rx="5" fill="#bfe0f3"/>
    <rect x="127" y="205" width="22" height="79" rx="5" fill="#5cbcec"/>
    <rect x="159" y="176" width="22" height="108" rx="5" fill="#0e9de8"/>
    <path d="M88 222 L128 196 L152 208 L196 168" fill="none" stroke="#0b3f63" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M176 168 L200 166 L194 190 Z" fill="#0b3f63"/>
  </g>

  <!-- sign board -->
  <g>
    <rect x="332" y="206" width="7" height="16" fill="#0b3f63"/>
    <rect x="441" y="206" width="7" height="16" fill="#0b3f63"/>
    <rect x="290" y="150" width="200" height="58" rx="12" fill="#0b3f63"/>
    <text x="390" y="186" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="21" font-weight="800" letter-spacing="4" fill="#ffffff">CITYFIED</text>
    <rect x="352" y="194" width="76" height="4" rx="2" fill="#0e9de8"/>
  </g>

  <!-- awning -->
  <g clip-path="url(#awningClip)">
    <rect x="145" y="222" width="48.75" height="60" fill="#0e9de8"/>
    <rect x="193.75" y="222" width="48.75" height="60" fill="#ffffff"/>
    <rect x="242.5" y="222" width="48.75" height="60" fill="#0e9de8"/>
    <rect x="291.25" y="222" width="48.75" height="60" fill="#ffffff"/>
    <rect x="340" y="222" width="48.75" height="60" fill="#0e9de8"/>
    <rect x="388.75" y="222" width="48.75" height="60" fill="#ffffff"/>
    <rect x="437.5" y="222" width="48.75" height="60" fill="#0e9de8"/>
    <rect x="486.25" y="222" width="48.75" height="60" fill="#ffffff"/>
    <rect x="145" y="276" width="390" height="8" fill="rgba(11,63,99,0.12)"/>
  </g>
  <!-- awning scallops -->
  <g>
    <circle cx="169.4" cy="282" r="24" fill="#0e9de8"/>
    <circle cx="218.1" cy="282" r="24" fill="#ffffff"/>
    <circle cx="266.9" cy="282" r="24" fill="#0e9de8"/>
    <circle cx="315.6" cy="282" r="24" fill="#ffffff"/>
    <circle cx="364.4" cy="282" r="24" fill="#0e9de8"/>
    <circle cx="413.1" cy="282" r="24" fill="#ffffff"/>
    <circle cx="461.9" cy="282" r="24" fill="#0e9de8"/>
    <circle cx="510.6" cy="282" r="24" fill="#ffffff"/>
  </g>
  <rect x="150" y="204" width="380" height="18" rx="9" fill="#0b3f63"/>

  <!-- kiosk body -->
  <rect x="170" y="282" width="340" height="238" rx="10" fill="#ffffff" stroke="#d7e9f4" stroke-width="2"/>
  <rect x="478" y="282" width="32" height="238" rx="10" fill="#eef6fb"/>
  <rect x="478" y="282" width="32" height="30" fill="#e2f0f8"/>

  <!-- serving window -->
  <rect x="200" y="312" width="280" height="138" rx="8" fill="#0b3f63"/>
  <rect x="200" y="312" width="280" height="138" rx="8" fill="rgba(14,157,232,0.08)"/>

  <!-- goods inside window -->
  <g fill="#9cc9e4" opacity="0.9">
    <rect x="216" y="392" width="18" height="40" rx="3"/>
    <rect x="220" y="384" width="10" height="10" rx="2"/>
    <rect x="240" y="398" width="22" height="34" rx="3"/>
    <rect x="245" y="390" width="12" height="8" rx="2"/>
    <rect x="420" y="398" width="26" height="34" rx="4"/>
    <rect x="450" y="404" width="18" height="28" rx="3"/>
    <rect x="424" y="406" width="18" height="4" fill="#7fb6d9"/>
    <rect x="424" y="416" width="18" height="4" fill="#7fb6d9"/>
  </g>
  <rect x="200" y="428" width="280" height="22" fill="rgba(9,44,70,0.55)"/>

  <!-- shopkeeper behind counter -->
  <g>
    <rect x="316" y="392" width="14" height="58" rx="7" fill="#8d5524"/>
    <rect x="352" y="392" width="14" height="58" rx="7" fill="#8d5524"/>
    <path d="M300 452 L300 406 Q300 382 325 382 L357 382 Q382 382 382 406 L382 452 Z" fill="#ffffff"/>
    <path d="M322 452 L322 404 L360 404 L360 452 Z" fill="#0e9de8"/>
    <rect x="322" y="382" width="38" height="22" rx="8" fill="#ffffff"/>
    <circle cx="341" cy="356" r="21" fill="#8d5524"/>
    <path d="M320 354 Q322 333 341 333 Q360 333 362 354 Q352 345 341 345 Q330 345 320 354 Z" fill="#1a1a1a"/>
  </g>

  <!-- counter ledge -->
  <rect x="185" y="444" width="310" height="18" rx="6" fill="#0e9de8"/>
  <rect x="185" y="444" width="310" height="7" rx="3.5" fill="#4dbcef"/>

  <!-- kiosk base panel -->
  <rect x="212" y="478" width="100" height="42" rx="6" fill="#eef6fb" stroke="#d7e9f4" stroke-width="2"/>
  <rect x="368" y="478" width="100" height="42" rx="6" fill="#eef6fb" stroke="#d7e9f4" stroke-width="2"/>
  <line x1="227" y1="492" x2="297" y2="492" stroke="#c6dfeb" stroke-width="4" stroke-linecap="round"/>
  <line x1="227" y1="503" x2="285" y2="503" stroke="#c6dfeb" stroke-width="4" stroke-linecap="round"/>
  <line x1="383" y1="492" x2="453" y2="492" stroke="#c6dfeb" stroke-width="4" stroke-linecap="round"/>
  <line x1="383" y1="503" x2="441" y2="503" stroke="#c6dfeb" stroke-width="4" stroke-linecap="round"/>

  <!-- customer with basket -->
  <g>
    <rect x="628" y="440" width="17" height="76" rx="8" fill="#263646"/>
    <rect x="658" y="440" width="17" height="76" rx="8" fill="#263646"/>
    <rect x="622" y="506" width="28" height="12" rx="6" fill="#1a2733"/>
    <rect x="652" y="506" width="28" height="12" rx="6" fill="#1a2733"/>
    <path d="M616 442 L616 362 Q616 340 640 340 L664 340 Q688 340 688 362 L688 442 Z" fill="#f0a03c"/>
    <rect x="688" y="352" width="14" height="84" rx="7" fill="#f0a03c"/>
    <circle cx="695" cy="440" r="10" fill="#8d5524"/>
    <rect x="646" y="322" width="14" height="20" fill="#8d5524"/>
    <circle cx="653" cy="306" r="22" fill="#8d5524"/>
    <path d="M631 304 Q633 282 653 282 Q673 282 675 304 Q664 294 653 294 Q642 294 631 304 Z" fill="#1a1a1a"/>
    <path d="M695 442 L730 442 L724 486 L700 486 Z" fill="#0b3f63"/>
    <path d="M698 442 Q712 424 727 442" fill="none" stroke="#0b3f63" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- phone card (mobile money) -->
  <g transform="rotate(-8 604 190)">
    <rect x="560" y="118" width="88" height="142" rx="15" fill="#0b3f63"/>
    <rect x="570" y="132" width="68" height="98" rx="7" fill="#ffffff"/>
    <circle cx="604" cy="168" r="17" fill="#1fae54"/>
    <path d="M596 168 L601.5 173.5 L612 162" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="580" y="196" width="48" height="7" rx="3.5" fill="#d7e9f4"/>
    <rect x="580" y="209" width="34" height="7" rx="3.5" fill="#d7e9f4"/>
    <circle cx="604" cy="245" r="5" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- coins -->
  <g>
    <circle cx="540" cy="205" r="13" fill="#f5b942" stroke="#e0922f" stroke-width="2.5"/>
    <circle cx="540" cy="205" r="6.5" fill="none" stroke="#e0922f" stroke-width="2"/>
    <circle cx="745" cy="330" r="15" fill="#f5b942" stroke="#e0922f" stroke-width="2.5"/>
    <circle cx="745" cy="330" r="8" fill="none" stroke="#e0922f" stroke-width="2"/>
    <circle cx="768" cy="362" r="11" fill="#f5b942" stroke="#e0922f" stroke-width="2.5"/>
  </g>

  <!-- plant -->
  <g transform="translate(45,0)">
    <path d="M96 522 L96 486 M96 500 Q80 486 74 468 Q96 480 98 494 M96 494 Q110 478 118 462 Q104 478 98 488" fill="none" stroke="#2f9e44" stroke-width="6" stroke-linecap="round"/>
    <path d="M78 522 L114 522 L108 550 L84 550 Z" fill="#f0a03c"/>
  </g>
</svg>
